<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NUTRIDIARY</title>
    <link rel="stylesheet" href="layoutNutriDiary.css">
</head>
<body>
    <section id="titulo1-NUTRIDIARY">
     <h1 id="titulo2-NUTRIDIARY">NUTRIDIARY</h1>
      </section>
      <section id="subtitulo1-NUTRIDIARY">
        <h3 id="subtitulo2-NUTRIDIARY">Alimentação saudável é essencial para nossa saúde. Acompanhe sua trajetória com a gente!</h3>
    </section>
        <section id="cadastro1-NUTRIDIARY">
            <h2 id="cadastro2-NUTRIDIARY">Criar sua conta</h2>
             <form id="cadastro3-NUTRIDIARY" action="paginainicial.html" method="get">
                <div class="campo1-NUTRIDIARY">
                    <label for="nome de usuário">Nome de Usuário</label>
                    <input type="text" id="nome de usuário" name="nome de usuário" minlength="5" maxlength="40" required>
                </div>
                  <div> 
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" maxlength="40" required>
                  </div>
                    <div>
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" minlength="6" maxlength="15" required>
                    </div>
                    <button type="submit">Cadastre-se Aqui</button>
             </form>
        </section>
    
</body>
</html>
